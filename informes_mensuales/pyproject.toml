[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "informes-mensuales"
version = "0.2.0"
description = "Generador del informe mensual ESMT (Odoo + License Manager + status de Genesys Cloud)"
requires-python = ">=3.11"
dependencies = [
    "docxtpl>=0.19",
    "python-docx>=1.1",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "Pillow>=10",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]

# Se instala en modo editable (pip install -e .): la plantilla, los logos y clientes.yaml
# se leen desde esta carpeta (informes.config.RAIZ).
[tool.setuptools]
packages = ["informes"]

[tool.setuptools.package-data]
informes = ["*.bas"]
